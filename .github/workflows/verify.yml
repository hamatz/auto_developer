# 壁：このワークフローをルールセット（またはブランチ保護）の「必須ステータスチェック」に指定して初めて壁になる。
# ファイルを置くだけでは壁にならない。バイパスは管理者も含め誰にも許さず、
# エージェントの資格情報にはワークフローやルールセットを変更できる権限を与えないこと。
name: verify
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      AUTO_DEV_REQUIRE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Enable bubblewrap sandbox (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-net --ro-bind / / true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          # README のコマンドを実行するテスト（DX-1）が `auto-dev` を使うため、利用者と同じく CLI をインストールする
          pip install -e .
      - name: Lint and format check
        run: |
          ruff check .
      - name: Type check
        run: |
          mypy src scripts
      - name: Run verification script
        run: |
          bash scripts/verify_local.sh
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

