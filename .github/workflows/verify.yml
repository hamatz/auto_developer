# 壁：このワークフローをルールセット（またはブランチ保護）の「必須ステータスチェック」に指定して初めて壁になる。
# ファイルを置くだけでは壁にならない。バイパスは管理者も含め誰にも許さず、
# エージェントの資格情報にはワークフローやルールセットを変更できる権限を与えないこと。
name: verify
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    # Phase 50 (SPEC 機能JJJ.1): 候補テストは OS サンドボックス内でのみ実行する（基盤がなければ Fail-Closed）。
    # macOS ランナーには sandbox-exec が標準で入っており、ローカルと同じ経路を検証できる（人間の判断: 2026-11-12 案A）。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
      - name: Lint and format check
        run: |
          ruff check .
      - name: Type check
        run: |
          mypy src scripts
      - name: Run verification script
        run: |
          bash scripts/verify_local.sh
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

